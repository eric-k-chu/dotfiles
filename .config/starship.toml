format = """
$username\
$hostname\
$directory\
$git_branch\
$aws\
$git_state\
$git_status\
$cmd_duration\
$fill\
$time\
$status\
$jobs\
$battery\
\n$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style) "
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style) "
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[aws]
format = '[$profile]($style) '
style = 'bright-red'

[time]
disabled = false
format = "[$time]($style) "
style = "white"
time_format = "%R"

[status]
disabled = false
format = "[$symbol$status]($style) "
style = "red"
symbol = "✘"

[jobs]
disabled = false
symbol = "⚙ "
threshold = 1
format = "[$symbol$number]($style) "
style = "bright-black"

[battery]
disabled = false
format = "[$symbol$percentage]($style) "

[fill]
symbol = " "
